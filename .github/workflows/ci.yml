name: DevOpsTracker CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      
      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore dependencies
        run: dotnet restore ./DevOpsTracker.Api/DevOpsTracker.Api.csproj

      - name: Begin SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Kani112a_devops-learning-tracker" \
            /o:"kani112a" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300

      - name: Build application
        run: dotnet build ./DevOpsTracker.Api/DevOpsTracker.Api.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test ./DevOpsTracker.Api/DevOpsTracker.Api.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Finish SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      
      - name: Build Docker image
        
      - name: Build Docker image
        run: |
          docker build \ -t kanishka01/devops-tracker-api:latest \ -f ./DevOpsTracker.Api/DockerFile \ ./DevOpsTracker.Api

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kanishka01/devops-tracker-api:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kanishka01/devops-tracker-api:latest
          format: json
          output: trivy-report.json
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy report
        if: always() && hashFiles('trivy-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: trivy-report.json
          retention-days: 14

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a  #v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push kanishka01/devops-tracker-api:latest
      
      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
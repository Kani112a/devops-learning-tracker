name: DevOpsTracker CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./DevOpsTracker.Api/DevOpsTracker.Api.csproj

      - name: Build application and tests
        run: dotnet build ./DevOpsTracker.Api/DevOpsTracker.Api.csproj --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test ./DevOpsTracker.Api/DevOpsTracker.Api.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      
      - name: Build Docker image for security scan
        run: docker build -t devopstracker-api:scan ./DevOpsTracker.Api

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devopstracker-api:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker push kanishka01/devops-tracker-api:latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./DevOpsTracker.Api
          file: ./DevOpsTracker.Api/DockerFile
          push: true
          tags: kanishka01/devops-tracker-api:latest
      
      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"